[package]
name = "photon-slam"
version = "0.1.0"
edition = "2024"

[dependencies]
vulkano = "0.35.2"
winit = { version = "0.30.13", features = ["android-native-activity"] }
image = "0.25"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytemuck = "1.25.0"
anyhow = "1.0.103"
thiserror = "2.0.18"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14.0"

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
ndk = {version = "0.9.0", features = ["media", "api-level-33"] }
ndk-sys = "0.6.0"
android_logger = "0.13"
android-activity = { version = "0.6", features = ["native-activity"] }

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.android]
# Optional: Specify the build tools version if auto-detection fails
build_tools_version = "35.0.0"

# https://developer.android.com/guide/topics/manifest/uses-sdk-element
[package.metadata.android.sdk]
min_sdk_version = 33
# The pinned Android SDK in this repo's flake only ships platform android-30
# (aapt needs its android.jar), so the target cannot exceed 30 without
# changing the flake.
target_sdk_version = 30

[package.metadata.android.application.activity]
exported = true

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera"
required = true
